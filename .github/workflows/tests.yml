name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ' · lowest deps' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: [12, 13]
        dependencies: [highest]
        include:
          - laravel: 12
            testbench: '^10.0'
          - laravel: 13
            testbench: '^11.0'
          - php: '8.2'
            laravel: 12
            dependencies: lowest
            testbench: '^10.0'
          - php: '8.3'
            laravel: 13
            dependencies: lowest
            testbench: '^11.0'
        exclude:
          # Laravel 13 requires PHP ^8.3
          - php: '8.2'
            laravel: 13

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        env:
          TESTBENCH: ${{ matrix.testbench }}
          # Composer blocks versions with security advisories by default, which would silently
          # raise the "lowest" leg above the floor composer.json actually claims to support.
          STABILITY_FLAGS: ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --no-security-blocking' || '--prefer-stable' }}
        run: composer update $STABILITY_FLAGS --with="orchestra/testbench:$TESTBENCH" --prefer-dist --no-interaction --no-progress

      - name: Verify resolved Laravel version
        env:
          EXPECTED: ${{ matrix.laravel }}
        run: |
          resolved=$(composer show laravel/framework --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "Resolved $resolved"
          case "$resolved" in
            v"$EXPECTED".*) ;;
            *) echo "::error::expected Laravel $EXPECTED.x, resolved $resolved"; exit 1 ;;
          esac

      - name: Run tests
        run: vendor/bin/pest
